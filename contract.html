<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гэрээ — BusinessBI.mn</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="site.css">
<script src="mp.js"></script>
<script src="site.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 72px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.doc{background:#fff;border:1px solid var(--bbi-line);border-radius:14px;padding:48px 56px;box-shadow:var(--bbi-shadow);font-size:14px;line-height:1.7;color:#1a2b25}
.doc h1{text-align:center;font-size:20px;letter-spacing:.02em;margin-bottom:4px}
.doc .sub{text-align:center;color:var(--bbi-muted);font-size:13px;margin-bottom:26px}
.doc h2{font-size:14.5px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.doc p{margin-bottom:8px}
.doc ol{padding-left:22px}.doc li{margin-bottom:5px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:16px 0}
.party{border:1px solid var(--bbi-line);border-radius:10px;padding:14px 16px;font-size:13.5px}
.party b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bbi-muted);margin-bottom:6px}
.party div{margin-bottom:2px}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}
.sig{border-top:1px solid #1a2b25;padding-top:10px;font-size:13px;min-height:90px}
.sig .nm{font-size:17px;font-weight:700;font-family:'Inter',cursive;color:var(--bbi-green)}
.sig .at{color:var(--bbi-muted);font-size:12px}
.sig .pending{color:var(--bbi-gold);font-weight:600}
.signbox{margin-top:22px;background:var(--bbi-green-soft);border:1px solid #cfe3d7;border-radius:14px;padding:20px 22px}
.signbox h3{font-size:16px;margin-bottom:6px}.signbox p{font-size:13.5px;color:var(--bbi-ink-soft);margin-bottom:12px}
.signbox input{width:100%;padding:12px 14px;border:1.5px solid var(--bbi-line);border-radius:10px;font:inherit;font-size:15px;margin-bottom:10px}
.signbox label{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-bottom:12px;cursor:pointer}
.signbox label input{width:18px;height:18px;margin:2px 0 0}
.msg{margin-top:10px;font-size:13.5px;min-height:18px}.msg.err{color:#c0492b}.msg.ok{color:var(--bbi-green);font-weight:600}
.events{margin-top:22px;font-size:12.5px;color:var(--bbi-muted)}
.events div{padding:4px 0;border-top:1px solid var(--bbi-line-soft)}
.center{text-align:center;padding:60px 20px;color:var(--bbi-muted)}
@media print{
  .bbi-nav,.bbi-footer,.bar,.signbox,.events,.noprint{display:none!important}
  body{background:#fff}.wrap{padding:0;max-width:none}.doc{border:none;box-shadow:none;padding:0;font-size:12.5px}
}
@media(max-width:700px){.doc{padding:26px 20px}.parties,.sigs{grid-template-columns:1fr}}
</style>
</head>
<body class="bbi-page" data-auth="supabase">
<div class="wrap">
  <div class="bar">
    <div class="l"><a href="my.html" class="bbi-btn ghost" style="padding:9px 14px;font-size:13.5px">← Самбар</a><span id="stBadge"></span></div>
    <div class="l"><button class="bbi-btn ghost" style="padding:9px 14px;font-size:13.5px" onclick="window.print()">🖨 Хэвлэх / PDF</button><button class="bbi-btn ghost" style="padding:9px 14px;font-size:13.5px" id="copyLink">🔗 Линк хуулах</button></div>
  </div>
  <div id="root" class="center">Гэрээ ачааллаж байна…</div>
</div>

<script>
(function(){
  const { esc, fmtMNT, fmtDate, fmtDT, conBadge, requireLogin } = BBIMP;
  const $=id=>document.getElementById(id);
  const id=new URLSearchParams(location.search).get('id');
  $('copyLink').onclick=()=>{ navigator.clipboard.writeText(location.href).then(()=>{ $('copyLink').textContent='✓ Хуулагдлаа'; setTimeout(()=>$('copyLink').textContent='🔗 Линк хуулах',1500); }); };
  if(!id){ $('root').innerHTML='Гэрээний дугаар (id) алга.'; return; }

  const plural=(n,w)=>n+' '+w;
  function endDate(c){ const d=new Date(c.start_date); d.setMonth(d.getMonth()+(c.term_months||12)); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }

  function docHTML(c, acc, me){
    const services=(c.services||[]).length?`<ol>${c.services.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'<p>—</p>';
    const accSig=c.accountant_signed_at?`<div class="nm">${esc(c.accountant_signature)}</div><div class="at">Электрон гарын үсэг · ${fmtDT(c.accountant_signed_at)}</div>`:`<div class="pending">Гарын үсэг хүлээгдэж байна</div>`;
    const cliSig=c.client_signed_at?`<div class="nm">${esc(c.client_signature)}</div><div class="at">Электрон гарын үсэг · ${fmtDT(c.client_signed_at)}</div>`:`<div class="pending">Гарын үсэг хүлээгдэж байна</div>`;
    return `<div class="doc">
      <h1>НЯГТЛАН БОДОХ БҮРТГЭЛИЙН ҮЙЛЧИЛГЭЭ ҮЗҮҮЛЭХ ГЭРЭЭ</h1>
      <div class="sub">№ ${esc(c.contract_no||'—')} · ${fmtDate(c.created_at)} · BusinessBI.mn платформ дээр байгуулав</div>
      <div class="parties">
        <div class="party"><b>Үйлчилгээ үзүүлэгч (Нягтлан)</b><div>${esc(acc?acc.name:'—')}</div>${acc&&acc.company_name?`<div>${esc(acc.company_name)}</div>`:''}${acc&&acc.tin?`<div>ТТД/РД: ${esc(acc.tin)}</div>`:''}${acc&&acc.phone?`<div>Утас: ${esc(acc.phone)}</div>`:''}${acc&&acc.email?`<div>Имэйл: ${esc(acc.email)}</div>`:''}</div>
        <div class="party"><b>Захиалагч (Компани)</b><div>${esc(c.company_name)}</div>${c.company_reg?`<div>Регистр/ТТД: ${esc(c.company_reg)}</div>`:''}${c.client_name?`<div>Төлөөлөгч: ${esc(c.client_name)}</div>`:''}${c.client_phone?`<div>Утас: ${esc(c.client_phone)}</div>`:''}${c.client_email?`<div>Имэйл: ${esc(c.client_email)}</div>`:''}</div>
      </div>
      <h2>1. Гэрээний зүйл</h2>
      <p>Үйлчилгээ үзүүлэгч нь Захиалагчийн нягтлан бодох бүртгэлийг Монгол Улсын Нягтлан бодох бүртгэлийн тухай хууль, Татварын ерөнхий хууль, холбогдох стандартын дагуу хөтөлж, дараах үйлчилгээг үзүүлнэ:</p>${services}
      <p>Үйлчилгээг BusinessBI.mn санхүүгийн програм дээр хөтөлнө. Захиалагч өөрийн компанийн бүртгэлийн явц, тайланг платформын «Миний самбар»-аас харах эрхтэй.</p>
      <h2>2. Хугацаа</h2>
      <p>Гэрээ <b>${fmtDate(c.start_date)}</b>-ээс эхлэн <b>${plural(c.term_months||12,'сарын')}</b> хугацаатай (<b>${fmtDate(endDate(c))}</b> хүртэл) хүчинтэй. Аль нэг тал дуусахаас 30 хоногийн өмнө бичгээр (платформоор) мэдэгдээгүй бол ижил нөхцөлөөр сунгагдана.</p>
      <h2>3. Төлбөр</h2>
      <p>Үйлчилгээний сарын төлбөр <b>${fmtMNT(c.fee_monthly)}</b> (НӨАТ ${c.fee_vat?'орсон':'ороогүй'}). Захиалагч сар бүрийн ${c.pay_day||10}-ны дотор төлнө. Хугацаа хэтэрсэн хоног тутамд төлөгдөөгүй дүнгийн 0.1%-ийн алданги тооцно.</p>
      <h2>4. Талуудын үүрэг</h2>
      <p><b>Үйлчилгээ үзүүлэгч:</b> анхан шатны баримтыг хүлээн авснаас хойш 5 ажлын өдрийн дотор бүртгэх; сар, улирал, жилийн тайланг хуулийн хугацаанд бэлтгэж Захиалагчид танилцуулан батлуулах; Захиалагчийн санхүүгийн мэдээллийн нууцыг хадгалах; тайлан тушаах хугацааг Захиалагчид урьдчилан сануулах.</p>
      <p><b>Захиалагч:</b> анхан шатны баримт (банкны хуулга, eBarimt падаан, НДШ тайлан, гэрээ г.м.)-ыг сар дуусснаас хойш 5 ажлын өдрийн дотор бүрэн, үнэн зөв гаргаж өгөх; тайланг хугацаанд нь батлах; төлбөрийг хугацаанд нь төлөх.</p>
      <h2>5. Хариуцлага</h2>
      <p>Үйлчилгээ үзүүлэгчийн буруугаас (хугацаа хоцроох, тооцооллын алдаа) учирсан торгууль, алдангийг Үйлчилгээ үзүүлэгч хариуцна. Захиалагч баримтаа дутуу, буруу, хугацаа хожимдуулж өгснөөс үүдсэн хариуцлагыг Захиалагч хариуцна. BusinessBI.mn нь платформ бөгөөд талуудын хооронд үүсэх үүрэг, хариуцлагын тал биш.</p>
      <h2>6. Гэрээ цуцлах</h2>
      <p>Аль нэг тал 30 хоногийн өмнө платформоор мэдэгдэж гэрээг цуцалж болно. Цуцлахад Үйлчилгээ үзүүлэгч сүүлийн төлбөртэй сар хүртэлх бүртгэл, тайлан, баримтыг Захиалагчид бүрэн шилжүүлнэ; журналын өгөгдлийг Захиалагч экспортлох эрхтэй.</p>
      ${c.extra_terms?`<h2>7. Нэмэлт нөхцөл</h2><p style="white-space:pre-wrap">${esc(c.extra_terms)}</p>`:''}
      <h2>${c.extra_terms?'8':'7'}. Бусад</h2>
      <p>Гэрээг талууд BusinessBI.mn платформ дээр нэвтэрч электрон хэлбэрээр баталгаажуулсан бөгөөд ижил хүчинтэй. Баталгаажуулсан хэрэглэгч, цаг, гарын үсэг платформын аудитын бүртгэлд хадгалагдана. Маргааныг харилцан тохиролцох, боломжгүй бол Монгол Улсын хуулийн дагуу шийдвэрлэнэ. Талууд хүсвэл хэвлэж гарын үсэг зурж хадгална.</p>
      <div class="sigs">
        <div class="sig"><div style="font-size:12px;color:var(--bbi-muted);margin-bottom:6px">ҮЙЛЧИЛГЭЭ ҮЗҮҮЛЭГЧ</div>${accSig}</div>
        <div class="sig"><div style="font-size:12px;color:var(--bbi-muted);margin-bottom:6px">ЗАХИАЛАГЧ</div>${cliSig}</div>
      </div>
    </div>`;
  }

  async function load(){
    const sb=await BBIMP.ready();
    const me=BBIMP.user;
    if(!me){ $('root').innerHTML=`<div class="center"><p style="margin-bottom:14px">Гэрээг үзэхийн тулд гэрээний тал (нягтлан эсвэл компанийн төлөөлөгч) нэвтэрнэ үү.</p><button class="bbi-btn" id="lg">Нэвтрэх</button></div>`; $('lg').onclick=()=>BBIMP.loginModal({returnTo:location.href}); return; }
    const { data:c, error } = await sb.from('mp_contracts').select('*').eq('id',id).maybeSingle();
    if(error||!c){ $('root').innerHTML=`<div class="center">Гэрээ олдсонгүй, эсвэл та энэ гэрээний тал биш байна.${error?'<br><small>'+esc(error.message)+'</small>':''}</div>`; return; }
    const { data:acc } = await sb.from('mp_accountants').select('name,company_name,tin,phone,email').eq('id',c.accountant_id).maybeSingle();
    $('stBadge').innerHTML=conBadge(c.status);
    const isAcc=c.accountant_user_id===me.id;
    const isCli=c.client_user_id===me.id||(!c.client_user_id&&c.client_email&&me.email&&c.client_email.toLowerCase()===me.email.toLowerCase());
    const mySigned=isAcc?!!c.accountant_signed_at:isCli?!!c.client_signed_at:true;
    let html=docHTML(c,acc,me);
    if((isAcc||isCli)&&!mySigned&&!['active','terminated','declined'].includes(c.status)){
      html+=`<div class="signbox"><h3>${isAcc?'Нягтлангийн':'Захиалагчийн'} гарын үсэг</h3><p>Бүтэн нэрээ бичиж, нөхцөлийг зөвшөөрснөө баталгаажуулна уу. Таны нэвтэрсэн бүртгэл (${esc(me.email||'')}), огноо, цаг аудитын бүртгэлд хадгалагдана.</p>
        <input id="sigName" placeholder="Овог, нэр (гарын үсэг)" value="${esc((me.user_metadata&&(me.user_metadata.full_name||me.user_metadata.name))||'')}">
        <label><input type="checkbox" id="sigAgree"> Гэрээний бүх нөхцөлийг уншиж, ойлгож, ${isAcc?'үйлчилгээ үзүүлэгчийн':'захиалагчийн'} хувиар зөвшөөрч байна. <a href="terms.html" target="_blank" style="color:var(--bbi-green)">BusinessBI платформын нөхцөл</a>-ийг зөвшөөрч байна.</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="bbi-btn" id="signBtn">✍ Гарын үсэг зурж баталгаажуулах</button><button class="bbi-btn ghost" id="declineBtn">Татгалзах</button></div>
        <div class="msg" id="sigMsg"></div></div>`;
    } else if((isAcc||isCli)&&c.status==='active'){
      html+=`<div class="signbox noprint"><h3>✓ Гэрээ хүчинтэй</h3><p>${isAcc?'Захиалагчийн компанийг журналдаа нээж бүртгэлээ эхлүүлнэ үү — «Нягтлангийн самбар» → Харилцагчид.':'Нягтлан тань бүртгэлийг BusinessBI журнал дээр хөтөлнө. Явцыг «Миний самбар»-аас харна.'}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a href="${isAcc?'partner.html':'my.html'}" class="bbi-btn">${isAcc?'Нягтлангийн самбар':'Миний самбар'} →</a><button class="bbi-btn ghost" id="termBtn">Гэрээ цуцлах</button></div><div class="msg" id="sigMsg"></div></div>`;
    }
    html+=`<div class="events" id="events"></div>`;
    $('root').className=''; $('root').innerHTML=html;
    const sb2=sb;
    if($('signBtn')) $('signBtn').onclick=async()=>{
      const nm=$('sigName').value.trim(), m=$('sigMsg');
      if(nm.length<3){ m.className='msg err'; m.textContent='Бүтэн нэрээ бичнэ үү.'; return; }
      if(!$('sigAgree').checked){ m.className='msg err'; m.textContent='Нөхцөлийг зөвшөөрч буйгаа чагтална уу.'; return; }
      $('signBtn').disabled=true; m.className='msg'; m.textContent='Баталгаажуулж байна…';
      const { data, error } = await sb2.rpc('mp_sign_contract',{ p_contract_id:id, p_signature:nm });
      if(error){ m.className='msg err'; m.textContent='Алдаа: '+error.message; $('signBtn').disabled=false; return; }
      m.className='msg ok'; m.textContent='✓ Гарын үсэг зурагдлаа.'; setTimeout(load,600);
    };
    if($('declineBtn')) $('declineBtn').onclick=async()=>{ if(!confirm('Гэрээнээс татгалзах уу?')) return; const {error}=await sb2.rpc('mp_set_contract_status',{p_contract_id:id,p_status:'declined',p_note:null}); if(error) alert(error.message); else load(); };
    if($('termBtn')) $('termBtn').onclick=async()=>{ const note=prompt('Цуцлах шалтгаан (заавал биш):'); if(note===null) return; const {error}=await sb2.rpc('mp_set_contract_status',{p_contract_id:id,p_status:'terminated',p_note:note||null}); if(error) alert(error.message); else load(); };
    const { data:ev } = await sb.from('mp_contract_events').select('type,note,created_at').eq('contract_id',id).order('created_at');
    const T={created:'Үүсгэсэн',sent:'Илгээсэн',signed_accountant:'Нягтлан гарын үсэг зурав',signed_client:'Захиалагч гарын үсэг зурав',activated:'Гэрээ хүчин төгөлдөр болов',terminated:'Цуцлав',declined:'Татгалзав',note:'Тэмдэглэл'};
    if(ev&&ev.length) $('events').innerHTML='<b>Аудитын бүртгэл</b>'+ev.map(e=>`<div>${fmtDT(e.created_at)} — ${T[e.type]||esc(e.type)}${e.note?': '+esc(e.note):''}</div>`).join('');
  }
  BBIMP.onAuth(()=>load());
})();
</script>
</body>
</html>
